<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCord</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="authOverlay" class="auth-overlay hidden">
    <div class="auth-card">
      <h1>PulseCord</h1>
      <p>Voice chat with live messages and account tracking.</p>

      <div class="auth-tabs">
        <button id="tabLogin" class="active" type="button">Login</button>
        <button id="tabSignup" type="button">Sign up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input name="username" placeholder="Username" autocomplete="username" required />
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <input name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="current-password" required />
        <label class="toggle-row"><input type="checkbox" class="reveal-toggle"> Show passwords</label>
        <button type="submit">Login</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <input name="username" placeholder="Choose a username" autocomplete="username" required />
        <input name="password" type="password" placeholder="Create a password" autocomplete="new-password" required />
        <input name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required />
        <label class="toggle-row"><input type="checkbox" class="reveal-toggle"> Show passwords</label>
        <button type="submit">Create account</button>
      </form>

      <div id="authError" class="error"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div>
          <div class="eyebrow">Accounts</div>
          <div id="meLabel" class="server-name">Loading...</div>
        </div>
        <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
      </div>

      <div class="section">
        <div class="section-head">
          <span class="section-title">Search</span>
          <select id="sortSelect" class="select-small">
            <option value="created-asc">Date created: first</option>
            <option value="created-desc">Date created: last</option>
            <option value="name-asc">A to Z</option>
            <option value="name-desc">Z to A</option>
          </select>
        </div>
        <input id="accountSearch" class="search-input" placeholder="Search account names" />
      </div>

      <div class="section grow">
        <div class="section-title">All accounts</div>
        <div id="accountList" class="account-list"></div>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="chat-head">
        <div>
          <div id="chatTitle" class="chat-title">Voice room</div>
          <div id="chatSubtitle" class="chat-subtitle">Messages update for every signed-in account.</div>
        </div>
        <div class="head-actions">
          <button id="joinVoiceBtn" class="ghost-btn" type="button">Join voice</button>
          <button id="muteBtn" class="ghost-btn" type="button">Mute</button>
          <button id="deafenBtn" class="ghost-btn" type="button">Deafen</button>
          <button id="refreshBtn" class="ghost-btn" type="button">Refresh</button>
        </div>
      </header>

      <section class="voice-panel">
        <div class="voice-status">
          <div>
            <strong>Voice participants</strong>
            <div id="voiceInfo">Not connected</div>
          </div>
          <button id="leaveVoiceBtn" class="ghost-btn" type="button">Leave voice</button>
        </div>
        <div id="voicePeers" class="voice-peers"></div>
      </section>

      <section id="messageList" class="message-list"></section>

      <form id="messageForm" class="message-form">
        <input id="messageInput" name="content" placeholder="Message the room..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
