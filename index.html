<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anon Board</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#222;
      color:white;
      max-width:700px;
      margin:auto;
      padding:20px;
    }

    textarea{
      width:100%;
      height:100px;
      margin-bottom:10px;
    }

    button{
      padding:10px 20px;
      cursor:pointer;
      margin-right:6px;
    }

    .post{
      background:#333;
      padding:10px;
      margin-top:10px;
      border-radius:5px;
      white-space:pre-wrap;
    }

    small{
      color:#aaa;
    }
  </style>
</head>
<body>
  <h1>Anon Board</h1>

  <textarea id="message" placeholder="Write something..."></textarea>
  <br>
  <button onclick="postMessage()">Post</button>
  <button onclick="clearPosts()">Clear</button>

  <hr>

  <div id="posts"></div>

  <script src="script.js"></script>
</body>
</html>
